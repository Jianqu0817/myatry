# Public example only. Never put API keys here.
# Windows Credential Manager target: MYATRI/DeepSeek/api.deepseek.com
[chat]
endpoint = "https://api.deepseek.com"
model = "deepseek-flash"
allow_paid = false
capabilities_verified = false

[budget]
daily_tokens = 50000000
# Conservative peak-rate USD estimates, per 1M tokens; actual billing can be lower.
input_per_million = 0.30
output_per_million = 1.20

[outreach]
enabled = false

[context]
# Natural chat: usually 20-100 chars; local fallback cap 160, no rewrite API.
reply_min_chars = 20
reply_max_chars = 160
reply_max_tokens = 1024
trace_every_turns = 30
timezone = "Asia/Shanghai"

limit = 1000000
compact_at = 650000
output_reserve = 4096
safety = 4096
compaction_chunk_bytes = 200000
compaction_max_chunks = 16
llm_compaction = true
llm_activation = false
reply_target_max_chars = 100
recall_budget_chars = 50000
recall_excerpt_chars = 4000
summary_budget_bytes = 60000
imported_history_budget_bytes = 96000
recent_history_turns = 80
recent_history_bytes = 240000
compaction_detail_items = 24
compaction_detail_chars = 600
compaction_output_tokens = 8000
capture_requests = false

[cognition]
# One completed user/assistant exchange counts as one turn.
maintenance_turns = 50
deep_every_batches = 3
persona_every_batches = 6
poll_seconds = 5

[storage]
# Roughly thirty dialogue turns; originals are committed immediately.
projection_every_commits = 60
